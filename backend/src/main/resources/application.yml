server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring:
  application:
    name: ai-career-copilot
  profiles:
    default: h2
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: 86400000 # 24 hours

ai:
  copilot:
    # Set to true if an external LLM (OpenAI/Gemini/Ollama) API key is configured
    llm-enabled: false
    api-key: ${LLM_API_KEY:}
    api-url: ${LLM_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${LLM_MODEL:gpt-4o-mini}
    rag:
      top-k: 4
      similarity-threshold: 0.25
