version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aicopilot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aicopilot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicopilot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicopilot-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/aicopilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - LLM_API_KEY=${LLM_API_KEY:-}
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aicopilot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicopilot-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aicopilot-net

volumes:
  mysql_data:
    driver: local

networks:
  aicopilot-net:
    driver: bridge
